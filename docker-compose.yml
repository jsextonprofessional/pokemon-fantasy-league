services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pfl
      POSTGRES_PASSWORD: pfl
      POSTGRES_DB: pfl
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pfl -d pfl']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  catalog-db:
